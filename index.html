<head>

<title>Dyson H2 Rollout - Week 3</title>
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#14171c; --muted:#5b6472; --line:#e3e6eb;
  --ok:#157347; --okbg:#e7f4ec; --pdf:#1d4ed8; --pdfbg:#eef3ff; --warn:#8a5a00; --warnbg:#fff4d6;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{position:sticky;top:0;z-index:10;background:#14171c;color:#fff;padding:12px 14px 10px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.bar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.sum{font-size:14px;color:#c4cad4}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid #3a414d;background:#232831;color:#fff;border-radius:999px;padding:9px 14px;font-size:15px;cursor:pointer;white-space:nowrap}
.chip small{color:#aab2bf;margin-left:4px}
.chip.on{background:#fff;color:#14171c;border-color:#fff}
.chip.on small{color:#5b6472}
.tools{display:flex;gap:8px;margin-top:6px}
.search{flex:1;min-width:0;border:1px solid #3a414d;background:#232831;color:#fff;border-radius:10px;padding:10px 12px;font-size:16px}
.search::placeholder{color:#8e97a6}
.btn{border:1px solid #3a414d;background:#232831;color:#fff;border-radius:10px;padding:10px 12px;font-size:14px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:12px 12px 60px}
.dayh{margin:22px 4px 10px;font-size:19px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.dayh span{font-size:14px;font-weight:500;color:var(--muted)}
.card{background:var(--card);border-radius:14px;border-left:8px solid var(--accent,#888);margin:0 0 14px;padding:14px 14px 6px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card.complete{background:var(--okbg);border-left-color:var(--ok)}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{background:var(--accent,#888);color:var(--pilltxt,#fff);border-radius:6px;padding:3px 9px;font-size:13px;font-weight:700}
.date{font-size:14px;color:var(--muted)}
.prog{margin-left:auto;font-size:14px;font-weight:700;color:var(--muted)}
.card.complete .prog{color:var(--ok)}
.badge{font-size:12px;font-weight:700;background:#e9ecf1;color:#4a5260;border-radius:6px;padding:3px 7px}
h2{font-size:23px;line-height:1.2;margin:8px 0 4px}
.addr{display:block;color:var(--muted);font-size:15px;text-decoration:none;margin-bottom:4px}
.addr:hover{text-decoration:underline}
.fix{font-size:15px;margin:4px 0 8px}
.fix b{font-weight:700}
.blk{border-radius:10px;margin:10px 0 10px;overflow:hidden;border:1px solid var(--line)}
.blk>h3{margin:0;padding:9px 12px;font-size:14px;letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.blk>h3 em{font-style:normal;font-weight:500;text-transform:none;letter-spacing:0;opacity:.85}
.sched>h3{background:#eef0f3;color:#394150}
.pdf{border-color:#c7d6fb}
.pdf>h3{background:var(--pdfbg);color:var(--pdf)}
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer;background:#fff;min-height:58px}
.row input{width:28px;height:28px;flex:0 0 auto;accent-color:var(--ok)}
.row.ticked{background:var(--okbg)}
.row.ticked .t1,.row.ticked .t2{text-decoration:line-through;color:#6a7a70}
.txt{flex:1;min-width:0}
.t1{font-size:19px;font-weight:700;overflow-wrap:anywhere}
.t2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.qty{flex:0 0 auto;background:#14171c;color:#fff;border-radius:8px;padding:4px 10px;font-size:18px;font-weight:700}
.thumb{flex:0 0 auto;width:62px;height:62px;border-radius:8px;border:1px solid var(--line);background:#fff;object-fit:contain}
.thumb.none{display:flex;align-items:center;justify-content:center;font-size:11px;color:#9aa2af;text-align:center;background:#f6f7f9}
.warn{background:var(--warnbg);color:var(--warn);font-size:14px;padding:9px 12px;border-top:1px solid #f0dca0}
.warn b{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
@media print{
  header{position:static;background:#fff;color:#000;box-shadow:none}
  .chips,.tools,.btn{display:none}
  body{background:#fff;font-size:13px}
  .card{break-inside:avoid;box-shadow:none;border:1px solid #bbb}
}
</style>

.chips{gap:6px;padding:12px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:0;padding:8px 13px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.04em;text-transform:uppercase}

.btn:hover,.chip:hover{border-color:var(--green-text)}
.dayh{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.02em;border-bottom:1px solid var(--line);padding-bottom:6px}
.dayh span{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.1em;color:var(--green-text)}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent,#888);border-radius:0;box-shadow:none}
.card.complete{background:var(--green);border-color:var(--green);border-left-color:var(--green-text)}
.pill{border-radius:2px;font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.date{color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.prog{font-family:var(--f-display);font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--green-text)}
.card.complete .prog{color:#fff}
.badge{background:#262626;color:var(--muted);border-radius:2px;font-family:var(--f-display);letter-spacing:.06em;text-transform:uppercase}
h2{font-family:var(--f-display);font-weight:700;font-size:28px;text-transform:uppercase;letter-spacing:.01em}
.addr{color:#d4d4d4;text-decoration:underline;text-underline-offset:2px}
.card.complete .addr{color:#fff}
.fix{color:var(--muted)}
.fix b{color:var(--ink)}
.blk{border-radius:0;border:1px solid var(--line)}
.blk>h3{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.12em}
.sched>h3{background:#1f1f1f;color:var(--muted)}
.pdf{border-color:#24433b}
.pdf>h3{background:var(--pdfbg);color:var(--pdf)}
.row{background:var(--surface);border-top:1px solid var(--line)}
.row:hover{background:#1b1b1b}
.row input{accent-color:var(--green-text)}
.row.ticked{background:var(--green-deep)}
.row.ticked .t1,.row.ticked .t2{color:rgba(255,255,255,.55)}
.t1{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.01em}
.t2{color:var(--muted)}
.qty{background:var(--green);color:#fff;border-radius:0;font-family:var(--f-display);font-weight:800;font-size:19px}
.thumb{border-radius:0;border:1px solid var(--line)}
.thumb.none{background:#1f1f1f;color:#6f6f6f}
.warn{background:var(--warnbg);color:var(--warn);border-top:1px solid #4a3a17}
.empty{color:var(--muted)}
@media print{
  :root{color-scheme:light}
  body,header,.card,.row,.blk>h3{background:#fff !important;color:#000 !important}
  .brand img{display:none}
  .kicker,.dayh span,.prog{color:#000 !important}
  .qty{background:#000;color:#fff}
  .row.ticked{background:#eee !important}
}
</style>

let ticks = {};
try { ticks = JSON.parse(localStorage.getItem('pickTicks') || '{}'); } catch (e) { ticks = {}; }
function saveTicks(){ try { localStorage.setItem('pickTicks', JSON.stringify(ticks)); } catch (e) {} }

function isoToday(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function toDate(iso){ const p = iso.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function short(iso){ return toDate(iso).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}); }
function long(iso){ return toDate(iso).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'}); }
function el(tag, cls, text){
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function showVal(v){
  if (/^\d+(\.\d+)?$/.test(v)) return '× ' + v;
  if (v.toUpperCase() === 'Y') return 'Yes';
  return v;
}

const today = isoToday();
const dates = Array.from(new Set(DATA.map(s => s.date))).sort();
const upcoming = dates.filter(d => d >= today);
let sel = upcoming.length ? 'upcoming' : 'all';
let query = '';

function visible(){
  const q = query.trim().toLowerCase();
  return DATA.filter(s => {
    if (sel === 'upcoming' && s.date < today) return false;
    if (sel !== 'upcoming' && sel !== 'all' && s.date !== sel) return false;
    if (q && (s.title + ' ' + s.retailer + ' ' + s.address).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function buildChips(){
  const box = document.getElementById('chips');
  box.textContent = '';
  const add = (key, label, count) => {
    const b = el('button', 'chip' + (sel === key ? ' on' : ''), label);
    if (count !== undefined) b.appendChild(el('small', null, String(count)));
    b.onclick = () => { sel = key; buildChips(); render(); };
    box.appendChild(b);
  };
  if (upcoming.length) add('upcoming', 'Upcoming', DATA.filter(s => s.date >= today).length);
  upcoming.forEach(d => add(d, short(d), DATA.filter(s => s.date === d).length));
  add('all', 'All dates', DATA.length);
}

function cardId(s){ return s.date + '|' + s.title; }

function makeRow(key, thumb, t1, t2, qty, onChange){
  const lab = el('label', 'row' + (ticks[key] ? ' ticked' : ''));
  const cb = el('input'); cb.type = 'checkbox'; cb.checked = !!ticks[key];
  cb.onchange = () => {
    if (cb.checked) ticks[key] = 1; else delete ticks[key];
    lab.classList.toggle('ticked', cb.checked);
    saveTicks(); onChange();
  };
  lab.appendChild(cb);
  if (thumb !== undefined){
    if (thumb){ const im = el('img', 'thumb'); im.src = thumb; im.alt = ''; lab.appendChild(im); }
    else lab.appendChild(el('div', 'thumb none', 'no image'));
  }
  const tx = el('div', 'txt');
  tx.appendChild(el('div', 't1', t1));
  if (t2) tx.appendChild(el('div', 't2', t2));
  lab.appendChild(tx);
  if (qty) lab.appendChild(el('div', 'qty', qty));
  return lab;
}

function buildCard(s){
  const col = COLORS[s.retailer] || ['#6b7280','#fff'];
  const card = el('article', 'card');
  card.style.setProperty('--accent', col[0]);
  card.style.setProperty('--pilltxt', col[1]);

  const keys = [];
  const top = el('div', 'top');
  top.appendChild(el('span', 'pill', s.retailer));
  top.appendChild(el('span', 'date', short(s.date)));
  if (s.done) top.appendChild(el('span', 'badge', 'Marked done in schedule'));
  const prog = el('span', 'prog');
  top.appendChild(prog);
  card.appendChild(top);

  card.appendChild(el('h2', null, s.title));
  if (s.address){
    const a = el('a', 'addr', s.address);
    a.href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(s.address);
    a.target = '_blank'; a.rel = 'noopener';
    card.appendChild(a);
  } else {
    card.appendChild(el('div', 'addr', 'No address in schedule'));
  }
  if (s.fixture){
    const f = el('div', 'fix');
    f.appendChild(document.createTextNode('Fixture: '));
    f.appendChild(el('b', null, s.fixture));
    card.appendChild(f);
  }

  function refresh(){
    const done = keys.filter(k => ticks[k]).length;
    prog.textContent = keys.length ? done + ' / ' + keys.length + ' picked' : '';
    card.classList.toggle('complete', keys.length > 0 && done === keys.length);
    updateSummary();
  }

  const sb = el('section', 'blk sched');
  const sh = el('h3', null, 'From schedule');
  sh.appendChild(el('em', null, s.items.length + ' items'));
  sb.appendChild(sh);
  if (!s.items.length) sb.appendChild(el('div', 'row', 'Nothing to pick from the schedule'));
  s.items.forEach(it => {
    const key = 's|' + cardId(s) + '|' + it.l;
    keys.push(key);
    sb.appendChild(makeRow(key, undefined, showVal(it.v), it.l, null, refresh));
  });
  card.appendChild(sb);

  if (s.pdf){
    const pb = el('section', 'blk pdf');
    const ph = el('h3', null, 'From packing sheet (PDF)');
    ph.appendChild(el('em', null, s.pdf.items.length + ' articles'));
    pb.appendChild(ph);
    s.pdf.diffs.forEach(d => {
      const w = el('div', 'warn');
      w.appendChild(el('b', null, 'Check: '));
      w.appendChild(document.createTextNode(d.field + ' differs. Packing sheet: ' + (d.pdf || 'blank') + '. Schedule: ' + (d.sheet || 'blank') + '.'));
      pb.appendChild(w);
    });
    s.pdf.items.forEach((it, i) => {
      const key = 'p|' + cardId(s) + '|' + i;
      keys.push(key);
      pb.appendChild(makeRow(key, it.img || '', it.name || '(no name)', it.fio, '× ' + it.qty, refresh));
    });
    card.appendChild(pb);
  }
  refresh();
  return card;
}

function updateSummary(){
  const list = visible();
  let total = 0, done = 0;
  list.forEach(s => {
    s.items.forEach(it => { total++; if (ticks['s|' + cardId(s) + '|' + it.l]) done++; });
    if (s.pdf) s.pdf.items.forEach((it, i) => { total++; if (ticks['p|' + cardId(s) + '|' + i]) done++; });
  });
  document.getElementById('sum').textContent = list.length + ' stores · ' + done + ' / ' + total + ' picked';
}

function render(){
  const main = document.getElementById('main');
  main.textContent = '';
  const list = visible();
  if (!list.length){
    main.appendChild(el('div', 'empty', 'Nothing to show. Try another date or clear the search.'));
    updateSummary();
    return;
  }
  const multi = Array.from(new Set(list.map(s => s.date))).length > 1;
  let last = null;
  list.forEach(s => {
    if (multi && s.date !== last){
      last = s.date;
      const n = list.filter(x => x.date === s.date).length;
      const h = el('div', 'dayh', long(s.date));
      h.appendChild(el('span', null, n + (n === 1 ? ' store' : ' stores')));
      main.appendChild(h);
    }
    main.appendChild(buildCard(s));
  });
  updateSummary();
}

document.getElementById('q').addEventListener('input', e => { query = e.target.value; render(); });
document.getElementById('print').onclick = () => window.print();
document.getElementById('reset').onclick = () => {
  if (confirm('Clear all ticks on this device?')){ ticks = {}; saveTicks(); render(); }
};

buildChips();
render();
</script>
</body>
</html>
